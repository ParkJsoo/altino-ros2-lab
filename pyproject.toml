[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altino-ros2-lab"
version = "0.1.0"
description = "Altino Lite BLE driver experiments and ROS2 lab foundation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pi = ["bleak>=0.22"]

[project.scripts]
altino-ble = "altino.cli:main"
altino-calibration = "altino.calibration:main"
altino-ros2-driver = "altino.ros2_driver:main"

[tool.setuptools]
packages = ["altino"]
